        <span><i class="dot out"></i>out of range</span><span><i class="dot unk"></i>unknown</span>
      </div></div>
      <p class="callout">Every signal has a permanent slot &mdash; nothing hidden, nothing a mode. The row is carrying <b>five</b> things at once. Scroll and judge whether you can still find a filename.</p>`;
    Object.keys(byDir).sort().forEach(d => {
      h += `<div class="dirline">${d || "./"}</div>`;
      byDir[d].forEach(f => {
        h += `<div class="row ${f[0] === SEL ? "sel" : ""}">
          ${revEl(f)}
          <span class="kind ${f[1] || "none"}">${f[1] || ""}</span>
          <span class="name ${f[1] ? "" : "dim"}">${base(f[0])}</span>
          <span class="flagdot">${f[7] ? "⚑" : ""}</span>
          ${churnEl(f)}
          ${ringEl(f[4])}
        </div>`;
      });
    });
    return h;
  }

  /* ── Variant B — progress first, rings on demand ────────────── */
  function variantB() {
    const done = changed.filter(f => f[5] === "reviewed");
    const stale = changed.filter(f => f[5] === "stale");
    const open = changed.filter(f => f[5] === "none" || f[5] === "partial");
    const pct = Math.round(done.length / changed.length * 100);

    const sec = (title, arr, note) => {
      if (!arr.length) return "";
      let s = `<div class="group"><h3>${title}</h3><span class="n">${arr.length}</span>${note ? `<span class="n">&mdash; ${note}</span>` : ""}</div>`;
      arr.forEach(f => {
        const hk = f[6] && f[6][1] > 1 ? `<span class="churn">${f[6][0]}/${f[6][1]}</span>` : "";
        s += `<div class="row ${f[0] === SEL ? "sel" : ""}">
          ${revEl(f)}
          <span class="name"><span class="path-prefix">${dir(f[0])}</span>${base(f[0])}</span>
          <span class="flagdot">${f[7] ? "⚑" : ""}</span>
          ${hk}${churnEl(f)}
        </div>`;
        if (f[0] === SEL) {
          s += `<div class="hunks">
            <div class="hunk"><span class="rev reviewed">✓</span><span class="at">@@ 1,14</span>ForwardedAuthorizationToCtx</div>
            <div class="hunk"><span class="rev none">·</span><span class="at">@@ 15,29</span>ForwardedAuthorizationFromCtx
              <span class="note">⚑ no test for the empty-header path</span></div>
          </div>`;
        }
      });
      return s;
    };

    return `<div class="exhead">
        <span class="eyebrow">This review &middot; ${done.length} of ${changed.length} files</span>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="toggles">
          <button class="tog" aria-pressed="true">Changed files</button>
          <button class="tog" aria-pressed="false">Whole repo</button>
          <button class="tog" aria-pressed="false">Show rings</button>
        </div>
      </div>
      <p class="callout">Ordered by what is left, not by path. Rings are a mode rather than a column &mdash; because on changed files the ring never varies: it is always <b>changed</b>.</p>
      ${sec("Needs another look", stale, "content moved under your mark")}
      ${sec("Not reviewed", open)}
      ${sec("Reviewed", done)}`;
  }

  /* ── Variant C — rings first, path secondary ────────────────── */
  function variantC() {
    const bands = [
      ["changed", "r0", "the PR touched these"],
      ["ring 1", "r1", "calls changed code directly"],
      ["ring 2", "r2", ""],
      ["ring 3", "r3", ""],
      ["unknown", "unk", "no call-hierarchy identity"],
      ["out of range", "out", "no call path to the change"],
    ];
    let h = `<div class="exhead">
      <span class="eyebrow">By distance from the change</span>
      <div class="toggles">
        <button class="tog" aria-pressed="true">Rings</button>
        <button class="tog" aria-pressed="false">Tree</button>
      </div></div>
      <p class="callout">Structure <i>is</i> the blast radius &mdash; reading downward is reading outward. But path context is gone, and the ten changed doc files land in <b>out of range</b>, mixed in with untouched code.</p>`;
    bands.forEach(([label, ring, hint]) => {
      const arr = F.filter(f => f[4] === ring);
      if (!arr.length) return;
      h += `<div class="group"><i class="dot ${dotCls(ring)}"></i><h3>${label}</h3><span class="n">${arr.length}</span>${hint ? `<span class="n">&mdash; ${hint}</span>` : ""}</div>`;
      arr.forEach(f => {
        h += `<div class="row ${f[0] === SEL ? "sel" : ""}">
          ${revEl(f)}
          <span class="kind ${f[1] || "none"}">${f[1] || ""}</span>
          <span class="name ${f[1] ? "" : "dim"}"><span class="path-prefix">${dir(f[0])}</span>${base(f[0])}</span>
          <span class="flagdot">${f[7] ? "⚑" : ""}</span>
          ${churnEl(f)}
        </div>`;
      });
    });
    return h;
  }

  const VARIANTS = [
    ["A", "Tree, everything permanent", variantA],
    ["B", "Progress first, rings on demand", variantB],
    ["C", "Rings first, path secondary", variantC],
  ];

  const PATCH = [
    "package middleware",
    "",
    "import (",
    "\t\"context\"",
    "",
    "\t\"github.com/aws/aws-lambda-go/events\"",
    "\t\"github.com/sitoo/go-utils-lambda/v2/alb/router\"",
    ")",
    "",
    "type forwardedAuthorizationCtxKey struct{}",
    "",
    "// ForwardedAuthorizationToCtx is an ALB middleware that copies the inbound",
    "// Authorization header into request context.",
    "// Used to forward credentials to the IAM API.",
    "func ForwardedAuthorizationToCtx(next router.HandleFunc) router.HandleFunc {",
    "\treturn func(ctx context.Context, req *events.ALBTargetGroupRequest) (*events.ALBTargetGroupResponse, error) {",
    "\t\tif hdr := router.GetHeaderValue(ctx, req, \"Authorization\"); hdr != \"\" {",
    "\t\t\tctx = context.WithValue(ctx, forwardedAuthorizationCtxKey{}, hdr)",
    "\t\t}",
    "\t\treturn next(ctx, req)",
    "\t}",
    "}",
  ];

  document.getElementById("code").innerHTML = PATCH
    .map((l, i) => `<div class="ln add"><span class="g">${i + 1}</span><span class="t">${esc(l)}</span></div>`)
    .join("");

  function current() {
    const k = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
    const i = VARIANTS.findIndex(v => v[0] === k);
    return i === -1 ? 0 : i;
  }

  function render() {
    const v = VARIANTS[current()];
    document.getElementById("explorer").innerHTML = v[2]();
    document.getElementById("swkey").textContent = v[0];
    document.getElementById("swname").textContent = v[1];
  }

  function go(delta) {
    const i = (current() + delta + VARIANTS.length) % VARIANTS.length;
    const u = new URL(location.href);
    u.searchParams.set("variant", VARIANTS[i][0]);
    history.replaceState(null, "", u);
    render();
  }

  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("next").addEventListener("click", () => go(1));

  addEventListener("keydown", e => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  });

  render();
</script>
